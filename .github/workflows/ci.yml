name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest --benchmark-skip
      - run: uv run pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench.json
